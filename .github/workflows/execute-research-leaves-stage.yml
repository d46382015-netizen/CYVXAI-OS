name: Execute governed research-leaves consolidation

on:
  push:
    branches:
      - mission/research-leaves-consolidation-stage-1
    paths:
      - .github/workflows/execute-research-leaves-stage.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/execute-research-leaves-stage.yml

permissions:
  contents: write

concurrency:
  group: topology-research-leaves-stage-1
  cancel-in-progress: false

jobs:
  execute:
    name: Plan, apply, fully verify, and retain rollback proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STAGE_ID: research-leaves
      PROOF_DIR: ${{ runner.temp }}/research-leaves-proof
    steps:
      - name: Check out the governed mission branch
        uses: actions/checkout@v6
        with:
          ref: mission/research-leaves-consolidation-stage-1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Execute approved stage with automatic rollback
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p "$PROOF_DIR"

          node ./scripts/topology-consolidation.js scan --json > "$PROOF_DIR/scan.json"
          node ./scripts/topology-consolidation.js plan "$STAGE_ID" --json > "$PROOF_DIR/plan.json"

          DIGEST="$(node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!p.ok||p.summary.blocked_moves!==0||p.summary.active_moves!==6)process.exit(2);process.stdout.write(p.approval.digest)' "$PROOF_DIR/plan.json")"
          printf '%s\n' "$DIGEST" > "$PROOF_DIR/approved-digest.txt"

          set +e
          node ./scripts/topology-consolidation.js apply "$STAGE_ID" --approve "$DIGEST" --verify full --json > "$PROOF_DIR/apply.json" 2> "$PROOF_DIR/apply-error.json"
          APPLY_STATUS=$?
          set -e

          if [ -d "$HOME/.cyvx/topology-consolidation" ]; then
            cp -a "$HOME/.cyvx/topology-consolidation" "$PROOF_DIR/state-store"
          fi

          if [ "$APPLY_STATUS" -ne 0 ]; then
            cat "$PROOF_DIR/apply-error.json" >&2
            exit "$APPLY_STATUS"
          fi

          RUN_ID="$(node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(p.status!=="applied"||!p.run_id)process.exit(3);process.stdout.write(p.run_id)' "$PROOF_DIR/apply.json")"
          printf '%s\n' "$RUN_ID" > "$PROOF_DIR/run-id.txt"
          node ./scripts/topology-consolidation.js verify-run "$RUN_ID" --json > "$PROOF_DIR/verification.json"

          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!p.ok)process.exit(4)' "$PROOF_DIR/verification.json"

          for link in physics science thermodynamics formal futures civilization; do
            test -L "$link"
            test -d "research/$link"
          done

          npm run topology:verify
          npm run repo:intelligence:verify
          git diff --check

          mkdir -p artifacts/topology/research-leaves-stage-1
          PROOF_DIR="$PROOF_DIR" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");
          const proofDir = process.env.PROOF_DIR;
          const read = (name) => JSON.parse(fs.readFileSync(path.join(proofDir, name), "utf8"));
          const document = {
            schema_version: 1,
            mission: "CYVX governed topology consolidation",
            stage_id: "research-leaves",
            source_commit: process.env.GITHUB_SHA,
            workflow_run_id: process.env.GITHUB_RUN_ID,
            generated_at: new Date().toISOString(),
            plan: read("plan.json"),
            apply: read("apply.json"),
            verification: read("verification.json")
          };
          document.proof = {
            algorithm: "sha256",
            digest: crypto.createHash("sha256").update(JSON.stringify(document)).digest("hex")
          };
          fs.writeFileSync("artifacts/topology/research-leaves-stage-1/proof.json", `${JSON.stringify(document, null, 2)}\n`);
          NODE

          rm -f .github/workflows/execute-research-leaves-stage.yml
          git status --short > "$PROOF_DIR/git-status.txt"
          test -s "$PROOF_DIR/git-status.txt"

      - name: Upload migration and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-leaves-stage-1-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/research-leaves-proof
          if-no-files-found: error
          retention-days: 90

      - name: Commit verified topology stage
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Execute governed research-leaves topology consolidation"
          git push origin HEAD:mission/research-leaves-consolidation-stage-1
