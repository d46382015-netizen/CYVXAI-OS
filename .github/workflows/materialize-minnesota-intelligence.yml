name: Materialize Minnesota Intelligence Vertical

on:
  push:
    branches:
      - feature/minnesota-intelligence-vertical
    paths:
      - .github/workflows/materialize-minnesota-intelligence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-minnesota-intelligence
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/minnesota-intelligence-vertical
          fetch-depth: 0
      - name: Validate and extract production source bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f artifacts/mn-intel-payload.aa
          test -f artifacts/mn-intel-payload.ab
          test -f artifacts/mn-intel-payload.ac
          test -f artifacts/mn-intel-payload.ad
          cat artifacts/mn-intel-payload.* | base64 --decode > /tmp/mn-intel-payload.tgz
          echo 'd4fb33f3982bc581ed48430252f83d32575c0b76e130385aa337c5ca11470cab  /tmp/mn-intel-payload.tgz' | sha256sum --check --strict
          tar -xzf /tmp/mn-intel-payload.tgz
      - name: Wire package commands
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.scripts = pkg.scripts || {};
          Object.assign(pkg.scripts, {
            'start:mn': 'node ./scripts/start-minnesota-vertical.js',
            'test:intel:mn': 'node --test ./test/minnesota-intelligence.test.js',
            'verify:intel:mn': 'node --check ./services/intelligence/minnesota/index.js && node --check ./services/intelligence/minnesota/server.js && node --check ./scripts/start-minnesota-vertical.js && node --test ./test/minnesota-intelligence.test.js',
            'intel:mn': 'node ./services/intelligence/minnesota/server.js',
            'intel:mn:refresh': 'node ./scripts/refresh-minnesota-intelligence.js'
          });
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
      - name: Verify production vertical
        run: npm run verify:intel:mn
      - name: Commit materialized capability
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f artifacts/mn-intel-payload.aa artifacts/mn-intel-payload.ab artifacts/mn-intel-payload.ac artifacts/mn-intel-payload.ad
          rmdir artifacts 2>/dev/null || true
          rm -f .github/workflows/materialize-minnesota-intelligence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Minnesota procurement and business intelligence vertical'
          git push origin HEAD:feature/minnesota-intelligence-vertical
