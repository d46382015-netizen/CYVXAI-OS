name: Deploy Supabase Schema

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to apply pending migrations to the production Supabase project
        required: true
        type: string

permissions:
  contents: read

env:
  SUPABASE_PROJECT_ID: yokpfcbdvszdavohibkh

jobs:
  deploy-production-schema:
    if: inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Require privileged deployment credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'SUPABASE_ACCESS_TOKEN secret is required.' >&2; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo 'SUPABASE_DB_PASSWORD secret is required.' >&2; exit 1; }
      - name: Install locked runtime dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify migration safety contract
        run: node ./scripts/verify-supabase-schema.js
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Show pending migration plan
        run: supabase migration list --linked
      - name: Apply production migrations
        run: supabase db push --include-all
      - name: Verify remote RLS and schema readiness
        run: CYVX_VERIFY_LIVE_SUPABASE_SCHEMA=true node ./scripts/verify-supabase-schema.js
      - name: Verify runtime connectivity
        run: npm run verify:supabase:live
