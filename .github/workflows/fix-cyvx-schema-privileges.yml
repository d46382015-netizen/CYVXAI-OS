name: Fix CYVX schema privileges

on:
  push:
    branches:
      - feat/supabase-production-schema-rls

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/supabase-production-schema-rls
      - name: Restrict revocation to owned relations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/migrations/202607120001_cyvx_production_schema.sql')
          text = p.read_text()
          old = "revoke all on all tables in schema public from anon;\nrevoke all on all tables in schema public from authenticated;"
          new = """revoke all on public.cyvx_schema_migrations, public.organizations, public.organization_members,
            public.agents, public.missions, public.mission_assignments, public.mission_events,
            public.artifacts, public.evidence_records, public.governance_principals,
            public.governance_constitutions, public.governance_controls, public.governance_packages,
            public.governance_reviews, public.governance_capability_grants, public.governance_budget_ledger,
            public.governance_events, public.foundry_action_runs, public.foundry_deployments,
            public.foundry_spend_receipts, public.outcomes from anon, authenticated;"""
          if old not in text:
              raise SystemExit('Expected privilege block not found')
          p.write_text(text.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations/202607120001_cyvx_production_schema.sql
          git commit -m 'Scope privilege revocation to CYVX tables'
          git push origin HEAD:feat/supabase-production-schema-rls
