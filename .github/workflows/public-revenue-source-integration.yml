name: Apply Public Revenue Integration

on:
  pull_request:
    paths:
      - "scripts/apply-public-revenue-integration.js"
      - ".github/workflows/public-revenue-source-integration.yml"

permissions:
  contents: write

concurrency:
  group: public-revenue-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Integrate revenue runtime with public deployment
        run: node scripts/apply-public-revenue-integration.js

      - name: Commit public runtime integration
        shell: bash
        run: |
          set -Eeuo pipefail
          git restore .github/workflows/deploy-public.yml
          if git diff --quiet -- api/public.js start.sh render.yaml; then
            echo "Public revenue runtime already integrated"
            exit 0
          fi
          git config user.name "CYVX Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/public.js start.sh render.yaml
          git commit -m "Expose venture revenue through public runtime"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"