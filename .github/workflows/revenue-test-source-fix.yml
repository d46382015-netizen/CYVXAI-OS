name: Apply Revenue Test Source Fix

on:
  pull_request:
    paths:
      - "scripts/apply-revenue-test-fix.js"
      - ".github/workflows/revenue-test-source-fix.yml"

permissions:
  contents: write

concurrency:
  group: revenue-test-source-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic test correction
        run: node scripts/apply-revenue-test-fix.js

      - name: Commit corrected test double
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- test/venture-revenue-engine.test.js; then
            echo "Test already corrected"
            exit 0
          fi
          git config user.name "CYVX Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/venture-revenue-engine.test.js
          git commit -m "Enforce fail-closed Stripe test boundary"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"