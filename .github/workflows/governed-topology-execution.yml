name: CYVX Governed Topology Execution

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .cyvx/topology-execution.json

permissions:
  contents: write

concurrency:
  group: topology-execution
  cancel-in-progress: false

jobs:
  execute:
    name: Execute authorized topology request
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the mission branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Execute the governed request
        id: execute
        env:
          CYVX_TOPOLOGY_PROOF_DIR: ${{ runner.temp }}/topology-execution-proof
        run: node ./scripts/execute-authorized-topology-request.js

      - name: Upload migration and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-leaves-stage-1-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/topology-execution-proof
          if-no-files-found: error
          retention-days: 90

      - name: Commit redacted fail-closed receipt
        if: failure()
        shell: bash
        env:
          PROOF_DIR: ${{ runner.temp }}/topology-execution-proof
        run: |
          set -euo pipefail
          mkdir -p artifacts/topology/research-leaves-stage-1
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const proofDir = process.env.PROOF_DIR;
          const readJson = (name) => {
            try { return JSON.parse(fs.readFileSync(path.join(proofDir, name), 'utf8')); }
            catch { return null; }
          };
          const readText = (name) => {
            try { return fs.readFileSync(path.join(proofDir, name), 'utf8').trim(); }
            catch { return null; }
          };
          const failure = readJson('operator-error.json');
          const rollback = failure && failure.rollback;
          const receipt = {
            schema_version: 1,
            status: 'failed_closed',
            request_id: 'research-leaves-stage-1',
            workflow_run_id: process.env.GITHUB_RUN_ID,
            source_commit: process.env.GITHUB_SHA,
            generated_at: new Date().toISOString(),
            topology_run_id: readText('run-id.txt'),
            error: failure && failure.error ? String(failure.error).slice(0, 1000) : 'unknown execution failure',
            rollback_verified: Boolean(rollback && rollback.rollback && rollback.rollback.verified),
            rollback_expected_digest: rollback && rollback.rollback ? rollback.rollback.expected_tree_digest || null : null,
            rollback_actual_digest: rollback && rollback.rollback ? rollback.rollback.actual_tree_digest || null : null
          };
          fs.writeFileSync('artifacts/topology/research-leaves-stage-1/failure.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/topology/research-leaves-stage-1/failure.json
          git diff --cached --check
          git commit -m "Record fail-closed research-leaves execution"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Commit only the fully verified migration
        if: steps.execute.outputs.executed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Execute governed research-leaves topology consolidation"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
