name: CYVX Repository Intelligence

on:
  pull_request:
    paths:
      - "api/**"
      - "apps/**"
      - "core/**"
      - "runtime/**"
      - "services/**"
      - "scripts/**"
      - "test/**"
      - "ui/**"
      - "config/repository-contract.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Inventory, drift, readiness, proof, and API verification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_ENV: test
      CYVX_ALLOW_INSECURE_LOCAL: "true"
      CYVX_REPOSITORY_INTELLIGENCE_ROOT: /tmp/cyvx-repository-intelligence
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify repository evolution control plane
        shell: bash
        run: |
          set -o pipefail
          npm run repo:intelligence:verify 2>&1 | tee /tmp/repository-intelligence-verify.log

      - name: Verify server and mobile dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          CYVX_REPOSITORY_INTELLIGENCE_PORT=3014 npm run repo:intelligence:serve >/tmp/repository-intelligence-server.log 2>&1 &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3014/healthz >/tmp/repository-intelligence-health.json; then break; fi
            sleep 1
          done
          node -e 'const x=require("/tmp/repository-intelligence-health.json");if(!x.ok||x.readiness_score<70||!x.proof)process.exit(1)'
          curl -fsS http://127.0.0.1:3014/repo-intelligence | grep -q "Repository Evolution Control Plane"
          curl -fsS http://127.0.0.1:3014/metrics | grep -q "cyvx_repository_readiness_score"
          curl -fsS -X POST http://127.0.0.1:3014/api/v1/repository-intelligence/scan | grep -q '"service":"cyvx-repository-intelligence"'

      - name: Upload proof and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-intelligence-proof
          path: |
            /tmp/repository-intelligence-verify.log
            /tmp/repository-intelligence-server.log
            /tmp/repository-intelligence-health.json
            /tmp/cyvx-repository-intelligence/latest.json
            /tmp/cyvx-repository-intelligence/latest.md
            /tmp/cyvx-repository-intelligence/history.jsonl
            /tmp/cyvx-repository-intelligence/repository-intelligence.jsonl
          if-no-files-found: ignore
          retention-days: 30
