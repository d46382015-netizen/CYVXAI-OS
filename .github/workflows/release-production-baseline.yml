name: Controlled CYVX Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Release target
        type: choice
        required: true
        default: staging
        options: [staging, production]
      ref:
        description: Branch, tag, or immutable commit SHA to release
        required: true
        default: main

permissions: write-all

concurrency:
  group: cyvx-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify-migrate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    env:
      NODE_ENV: test
      CYVX_ENV: release-verification
      CYVX_ALLOW_INSECURE_LOCAL: "true"
      CYVX_DATA_ROOT: /tmp/cyvx-release-verification
      CYVX_DATABASE_URL: ${{ secrets.CYVX_DATABASE_URL }}
      CYVX_RENDER_DEPLOY_HOOK_URL: ${{ secrets.CYVX_RENDER_DEPLOY_HOOK_URL }}
      CYVX_RELEASE_URL: ${{ secrets.CYVX_RELEASE_URL }}
      CYVX_API_KEY: ${{ secrets.CYVX_API_KEY }}
      CYVX_EDGE_ORIGIN_SECRET: ${{ secrets.CYVX_EDGE_ORIGIN_SECRET }}
      CYVX_WORKLOAD_IDENTITY_AUDIENCE: ${{ vars.CYVX_WORKLOAD_IDENTITY_AUDIENCE || 'cyvx-production' }}
      CYVX_WORKLOAD_IDENTITY_EXCHANGE_URL: ${{ secrets.CYVX_WORKLOAD_IDENTITY_EXCHANGE_URL }}
      CYVX_WORKLOAD_IDENTITY_SCOPE: ${{ vars.CYVX_WORKLOAD_IDENTITY_SCOPE || 'deploy migrate backup' }}
      CYVX_OIDC_EVIDENCE_FILE: /tmp/cyvx-oidc-evidence.json
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify release candidate
        run: npm run verify:production-baseline
      - name: Prove GitHub workload identity
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "$CYVX_WORKLOAD_IDENTITY_EXCHANGE_URL" ]; then
            node ./scripts/oidc-smoke-v8.js --exchange
          else
            node ./scripts/oidc-smoke-v8.js
          fi
      - name: Apply managed PostgreSQL migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CYVX_DATABASE_URL"
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          for migration in ops/postgres/*.sql; do
            psql "$CYVX_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$CYVX_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select cyvx_health();" | tee /tmp/cyvx-release-database-health.json
      - name: Trigger controlled Render deployment
        run: |
          test -n "$CYVX_RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$CYVX_RENDER_DEPLOY_HOOK_URL" | tee /tmp/cyvx-render-deploy-response.txt
      - name: Wait for release readiness and integration health
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CYVX_RELEASE_URL"
          test "${#CYVX_API_KEY}" -ge 32
          test "${#CYVX_EDGE_ORIGIN_SECRET}" -ge 32
          BASE="${CYVX_RELEASE_URL%/}"
          EDGE="x-cyvx-edge-secret: $CYVX_EDGE_ORIGIN_SECRET"
          KEY="x-api-key: $CYVX_API_KEY"
          for attempt in $(seq 1 60); do
            if curl -fsS -H "$EDGE" "$BASE/readyz" > /tmp/cyvx-release-ready.json; then
              curl -fsS "$BASE/healthz" > /tmp/cyvx-release-health.json
              curl -fsS -H "$EDGE" "$BASE/api/public/status" > /tmp/cyvx-release-status.json
              curl -fsS -H "$EDGE" -H "$KEY" "$BASE/api/v1/integrations/status" > /tmp/cyvx-release-integrations.json
              curl -fsS -X POST -H "$EDGE" -H "$KEY" -H 'content-type: application/json' -d '{}' \
                "$BASE/api/v1/integrations/probe" > /tmp/cyvx-release-integration-probe.json
              node - <<'NODE'
              const fs = require('fs');
              const ready = JSON.parse(fs.readFileSync('/tmp/cyvx-release-ready.json'));
              const integrations = JSON.parse(fs.readFileSync('/tmp/cyvx-release-integrations.json'));
              const probe = JSON.parse(fs.readFileSync('/tmp/cyvx-release-integration-probe.json'));
              if (!ready.ready || !integrations.integrations?.ready || !probe.integrations?.ready || !probe.integrations?.live?.data?.healthy) process.exit(1);
              NODE
              exit 0
            fi
            sleep 10
          done
          echo "::error::Release did not become integration-ready within ten minutes"
          exit 1
      - name: Retain immutable release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyvx-release-${{ inputs.environment }}-${{ github.sha }}
          path: |
            /tmp/cyvx-oidc-evidence.json
            /tmp/cyvx-release-database-health.json
            /tmp/cyvx-render-deploy-response.txt
            /tmp/cyvx-release-ready.json
            /tmp/cyvx-release-health.json
            /tmp/cyvx-release-status.json
            /tmp/cyvx-release-integrations.json
            /tmp/cyvx-release-integration-probe.json
          if-no-files-found: ignore
          retention-days: 180
