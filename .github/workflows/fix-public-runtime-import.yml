name: Fix Public Runtime Import

on:
  pull_request:
    paths:
      - "scripts/fix-public-runtime-import.js"
      - ".github/workflows/fix-public-runtime-import.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: node scripts/fix-public-runtime-import.js
      - shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- api/public.js; then exit 0; fi
          git config user.name "CYVX Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/public.js
          git commit -m "Remove duplicate universal runtime import"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"