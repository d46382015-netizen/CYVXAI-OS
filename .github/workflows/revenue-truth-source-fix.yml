name: Apply Revenue Truth Source Fix

on:
  pull_request:
    paths:
      - "scripts/apply-revenue-truth-fix.js"
      - ".github/workflows/revenue-truth-source-fix.yml"

permissions:
  contents: write

concurrency:
  group: revenue-truth-source-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic truth corrections
        run: node scripts/apply-revenue-truth-fix.js

      - name: Commit corrected revenue source
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- services/revenue/engine.js ui/revenue-engine.html; then
            echo "Revenue source already corrected"
            exit 0
          fi
          git config user.name "CYVX Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add services/revenue/engine.js ui/revenue-engine.html
          git commit -m "Preserve venture price and separate revenue verification"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"