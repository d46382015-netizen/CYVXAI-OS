name: Generate Workflow Permission Migration

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-workflow-permission-migration.js"
      - ".github/workflows/workflow-permission-migration-generator.yml"
  workflow_dispatch:

permissions: write-all

concurrency:
  group: workflow-permission-migration-generator
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Generate deterministic permission patch manifest
        run: node ./scripts/generate-workflow-permission-migration.js
      - name: Commit patch manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/policy-migration/workflow-patch.json
          if git diff --cached --quiet; then
            echo "Permission manifest is already current."
            exit 0
          fi
          git commit -m "Generate workflow permission migration manifest"
          git push origin HEAD:main
