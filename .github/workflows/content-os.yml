name: Content OS Production Proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/content-os/**'
      - 'scripts/content-os.sh'
      - 'scripts/verify-content-os.js'
      - 'test/content-os.test.js'
      - 'docs/CONTENT_OS.md'
      - 'package.json'
      - '.github/workflows/content-os.yml'
  push:
    branches: [main]
    paths:
      - 'services/content-os/**'
      - 'scripts/content-os.sh'
      - 'scripts/verify-content-os.js'
      - 'test/content-os.test.js'
      - 'package.json'
      - '.github/workflows/content-os.yml'

permissions: write-all

concurrency:
  group: content-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Static validation
        run: |
          node --check ./services/content-os/index.js
          node --check ./services/content-os/server.js
          node --check ./services/content-os/worker.js
          node --check ./scripts/verify-content-os.js
          bash -n ./scripts/content-os.sh
      - name: Unit and state tests
        run: npm run content:test
      - name: Real topic-to-render-to-measure proof
        run: npm run content:verify
