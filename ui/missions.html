<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CYVXAI Mission Runtime</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#eef2ff;background:#080b13;--panel:#111827;--line:#26324a;--muted:#9aa7bd;--ok:#3ddc97;--bad:#ff6b7a;--warn:#ffca62;--accent:#8ea7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#16213a 0,#080b13 50%);padding-bottom:72px}header{position:sticky;top:0;z-index:4;padding:14px 16px;background:rgba(8,11,19,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:18px;margin:0}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}.status{font-size:12px;padding:6px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}.status.ok{color:var(--ok);border-color:#245b47}.status.bad{color:var(--bad);border-color:#69303b}.wrap{max-width:1100px;margin:auto;padding:14px}.grid{display:grid;gap:12px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{background:rgba(17,24,39,.94);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.22)}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}input,textarea,select,button{width:100%;font:inherit;border-radius:10px;border:1px solid var(--line);padding:11px;background:#0b1220;color:#eef2ff}textarea{min-height:90px;resize:vertical}button{cursor:pointer;background:#22345e;border-color:#3f5795;font-weight:700}button.secondary{background:#141d2f}button.danger{background:#4b1f29;border-color:#7a3242}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}.message{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:13px;background:#192337;border:1px solid var(--line)}.message.error{color:#ffd5da;border-color:#6e2d39;background:#2a151c}.message.warn{color:#ffe3a5;border-color:#70552a;background:#2b2415}.empty{color:var(--muted);padding:22px;text-align:center}.mission{padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}.mission:hover{border-color:var(--accent)}.mission strong{display:block}.meta{display:flex;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:12px;margin-top:6px}.chip{padding:3px 7px;border:1px solid var(--line);border-radius:999px}.timeline{border-left:2px solid var(--line);padding-left:14px}.timeline article{margin:0 0 13px}.timeline time{font-size:11px;color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;background:#090e19;border:1px solid var(--line);padding:10px;border-radius:10px;font-size:11px;max-height:280px;overflow:auto}.hidden{display:none!important}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#0b101c;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}.tabs button{border:0;background:transparent;padding:8px;font-size:12px;color:var(--muted)}.tabs button.active{color:#fff}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #4b5870;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:720px){.two{grid-template-columns:1fr}.wrap{padding:10px}.panel{border-radius:13px}header{padding:11px 12px}}
</style>
</head>
<body>
<header><div><h1>CYVXAI Mission Runtime</h1><div id="principal" class="meta"></div></div><span id="runtimeStatus" class="status">Checking runtime</span></header>
<main class="wrap">
<section id="authView" class="panel">
<h2>Operator authentication</h2>
<p class="meta">Local token issuance is available only when the server enables local development authentication.</p>
<div class="grid two"><div><label>Organization</label><input id="authOrg" value="default" autocomplete="organization"></div><div><label>User ID</label><input id="authUser" value="admin-local" autocomplete="username"></div></div>
<div class="actions"><button id="loginBtn">Create session</button><button id="logoutBtn" class="secondary">Clear session</button></div><div id="authMessage"></div>
</section>

<section id="missionsView" class="view panel hidden">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Missions</h2><button id="refreshBtn" class="secondary" style="width:auto">Refresh</button></div>
<div id="missionMessage"></div><div id="missionList"></div>
</section>

<section id="createView" class="view panel hidden">
<h2>Create mission</h2>
<form id="createForm"><label>Title</label><input id="title" maxlength="200" required><label>Objective</label><textarea id="objective" maxlength="2000" required></textarea><div class="grid two"><div><label>Risk</label><select id="risk"><option>low</option><option selected>medium</option><option>high</option></select></div><div><label>Priority</label><input id="priority" type="number" min="1" max="100" value="50"></div></div><label>Success metrics, one per line</label><textarea id="metrics" placeholder="verified outcome&#10;restart recovery"></textarea><button type="submit">Create durable mission</button></form><div id="createMessage"></div>
</section>

<section id="detailsView" class="view hidden">
<div id="detailMessage"></div>
<div id="detailHeader" class="panel"></div>
<div class="grid two" style="margin-top:12px"><section class="panel"><h2>Operations</h2><div id="operations"></div></section><section class="panel"><h2>Job and outcome</h2><div id="jobOutcome"></div></section></div>
<div class="grid two" style="margin-top:12px"><section class="panel"><h2>Evidence</h2><div id="evidence"></div></section><section class="panel"><h2>Timeline</h2><div id="timeline"></div></section></div>
<section class="panel" style="margin-top:12px"><h2>Audit</h2><div id="audit"></div></section>
</section>
</main>
<nav class="tabs"><button data-view="missionsView" class="active">Missions</button><button data-view="createView">Create</button><button data-view="detailsView">Details</button></nav>
<script>
const state={token:localStorage.getItem('cyvxMissionToken')||'',principal:JSON.parse(localStorage.getItem('cyvxMissionPrincipal')||'null'),missions:[],selected:null,loading:false};
const $=id=>document.getElementById(id);const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(target,text,type=''){target.innerHTML=text?`<div class="message ${type}">${escapeHtml(text)}</div>`:''}
function setLoading(button,loading,label){button.disabled=loading;button.innerHTML=loading?'<span class="spinner"></span> Working':label}
async function api(path,options={}){const headers={'content-type':'application/json',...(options.headers||{})};if(state.token)headers.authorization=`Bearer ${state.token}`;const response=await fetch(path,{...options,headers});let payload={};try{payload=await response.json()}catch{}if(!response.ok)throw Object.assign(new Error(payload.message||`Request failed (${response.status})`),{status:response.status,code:payload.error,payload});return payload}
function show(view){document.querySelectorAll('.view').forEach(node=>node.classList.add('hidden'));$(view).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(button=>button.classList.toggle('active',button.dataset.view===view));if(view==='missionsView')loadMissions();if(view==='detailsView'&&state.selected)loadDetails(state.selected)}
function renderPrincipal(){const p=state.principal;$('principal').innerHTML=p?`<span>${escapeHtml(p.id)}</span><span class="chip">${escapeHtml(p.role)}</span><span class="chip">${escapeHtml(p.organization_id)}</span>`:'<span>Not authenticated</span>';document.querySelectorAll('.view').forEach(node=>node.classList.toggle('hidden',!state.token));$('authView').classList.toggle('hidden',Boolean(state.token));}
async function checkRuntime(){try{const result=await api('/api/v1/runtime/readiness');$('runtimeStatus').textContent=result.ready?'Runtime ready':'Worker offline';$('runtimeStatus').className=`status ${result.ready?'ok':'bad'}`;}catch(error){$('runtimeStatus').textContent=error.status===503?'Worker offline':'Runtime unavailable';$('runtimeStatus').className='status bad';}}
async function login(){const button=$('loginBtn');setLoading(button,true,'Create session');message($('authMessage'),'');try{const result=await api('/api/v1/auth/token',{method:'POST',body:JSON.stringify({organization_id:$('authOrg').value.trim(),user_id:$('authUser').value.trim()})});state.token=result.token;state.principal=result.principal;localStorage.setItem('cyvxMissionToken',state.token);localStorage.setItem('cyvxMissionPrincipal',JSON.stringify(state.principal));renderPrincipal();show('missionsView');}catch(error){message($('authMessage'),error.message,error.status===403?'warn':'error')}finally{setLoading(button,false,'Create session')}}
function logout(){state.token='';state.principal=null;state.selected=null;localStorage.removeItem('cyvxMissionToken');localStorage.removeItem('cyvxMissionPrincipal');renderPrincipal()}
async function loadMissions(){if(!state.token)return;const list=$('missionList');list.innerHTML='<div class="empty"><span class="spinner"></span> Loading missions</div>';message($('missionMessage'),'');try{const result=await api('/api/v1/missions');state.missions=result.missions;list.innerHTML=state.missions.length?state.missions.map(m=>`<article class="mission" data-id="${escapeHtml(m.id)}"><strong>${escapeHtml(m.title)}</strong><div class="meta"><span class="chip">${escapeHtml(m.status)}</span><span>${escapeHtml(new Date(m.updated_at).toLocaleString())}</span><span>Priority ${escapeHtml(m.priority)}</span></div></article>`).join(''):'<div class="empty">No missions exist for this organization.</div>';list.querySelectorAll('.mission').forEach(node=>node.onclick=()=>{state.selected=node.dataset.id;show('detailsView')});}catch(error){list.innerHTML='';message($('missionMessage'),error.message,error.status===403?'warn':'error')}}
async function createMission(event){event.preventDefault();const button=event.submitter;setLoading(button,true,'Create durable mission');message($('createMessage'),'');const title=$('title').value.trim(),objective=$('objective').value.trim();if(!title||!objective){message($('createMessage'),'Title and objective are required.','error');setLoading(button,false,'Create durable mission');return}try{const success_metrics=$('metrics').value.split('\n').map(v=>v.trim()).filter(Boolean).map((name,index)=>({key:`metric_${index+1}`,name,target:1}));const result=await api('/api/v1/missions',{method:'POST',body:JSON.stringify({title,objective,risk_level:$('risk').value,priority:Number($('priority').value),success_metrics})});state.selected=result.mission.id;event.target.reset();$('priority').value=50;show('detailsView')}catch(error){message($('createMessage'),error.message,error.status===403?'warn':'error')}finally{setLoading(button,false,'Create durable mission')}}
async function safe(path){try{return await api(path)}catch(error){return{_error:error}}}
function button(label,action,kind=''){return`<button class="${kind}" data-action="${action}">${label}</button>`}
async function loadDetails(id){const header=$('detailHeader');header.innerHTML='<div class="empty"><span class="spinner"></span> Loading mission</div>';message($('detailMessage'),'');const main=await safe(`/api/v1/missions/${encodeURIComponent(id)}`);if(main._error){header.innerHTML='';message($('detailMessage'),main._error.message,main._error.status===403?'warn':'error');return}const graph=main.graph,m=graph.mission;state.selected=m.id;const [job,events,audits,evidence,outcome]=await Promise.all([safe(`/api/v1/missions/${m.id}/job`),safe(`/api/v1/missions/${m.id}/events`),safe(`/api/v1/missions/${m.id}/audits`),safe(`/api/v1/missions/${m.id}/evidence`),safe(`/api/v1/missions/${m.id}/outcome`)]);header.innerHTML=`<h2>${escapeHtml(m.title)}</h2><p>${escapeHtml(m.objective)}</p><div class="meta"><span class="chip">${escapeHtml(m.status)}</span><span class="chip">${escapeHtml(m.risk_level)}</span><span>Created ${escapeHtml(new Date(m.created_at).toLocaleString())}</span><span>Agent ${escapeHtml(m.assigned_agent_id||'unassigned')}</span></div>`;renderOperations(m,graph.approval,job.job);renderJobOutcome(job,outcome);renderEvidence(evidence,m);renderTimeline(events);renderAudit(audits);checkRuntime()}
function renderOperations(m,approval,job){const role=state.principal?.role;const allowed=(...roles)=>roles.includes(role);let html='<div class="actions">';if(m.status==='draft'&&allowed('admin'))html+=button('Validate','validate');if(m.status==='validated'&&allowed('admin'))html+=button('Plan','plan');if(m.status==='planned'&&allowed('admin'))html+=button('Request approval','approval-request');if(m.status==='awaiting_approval'&&allowed('admin','approver'))html+=button('Approve','approve')+button('Reject','reject','danger');if(m.status==='approved'&&allowed('admin'))html+=button('Assign agent','assign');if(m.status==='queued'&&allowed('admin','agent'))html+=button('Queue execution','execute');if(['draft','validated','planned','awaiting_approval','approved','queued'].includes(m.status)&&allowed('admin'))html+=button('Cancel','cancel','danger');if(job&&['failed','retryable'].includes(job.status)&&allowed('admin'))html+=button('Safe requeue','requeue');html+=button('Verify evidence','verify','secondary')+button('Refresh','refresh','secondary')+'</div><div id="operationMessage"></div>';if(!allowed('admin','approver','agent'))html+='<div class="message warn">Viewer access is read-only.</div>';$('operations').innerHTML=html;$('operations').querySelectorAll('[data-action]').forEach(node=>node.onclick=()=>runAction(node.dataset.action,m,approval,job,node))}
async function runAction(action,m,approval,job,buttonNode){setLoading(buttonNode,true,buttonNode.textContent);message($('operationMessage'),'');try{let path,body={};if(action==='refresh'){return loadDetails(m.id)}if(action==='validate'){path=`/api/v1/missions/${m.id}/validate`;body={feasible:true,assumptions:['Operator validation']}}if(action==='plan'){path=`/api/v1/missions/${m.id}/plan`;body={actions:[{step:1,description:'Execute deterministic local capability'}],dependencies:[],estimated_duration_minutes:1,resource_requirements:{runtime:'local'}}}if(action==='approval-request'){path=`/api/v1/missions/${m.id}/approval-request`;body={reason:'Production execution approval'}}if(action==='approve'||action==='reject'){path=`/api/v1/approvals/${approval.id}/decide`;body={decision:action==='approve'?'approved':'rejected',decision_reason:'Operator decision'}}if(action==='assign'){const agent=prompt('Agent user ID','agent-local');if(!agent)return;path=`/api/v1/missions/${m.id}/assign-agent`;body={agent_id:agent}}if(action==='execute'){path=`/api/v1/missions/${m.id}/execute`;body={};}if(action==='cancel'){if(!confirm('Cancel this mission? This cannot be undone.'))return;path=`/api/v1/missions/${m.id}/cancel`;body={reason:'Cancelled from operator UI'}}if(action==='requeue'){if(!confirm('Requeue this failed job for another controlled attempt?'))return;path=`/api/v1/jobs/${job.id}/requeue`;body={}}if(action==='verify'){path='/api/v1/evidence/verify';body={mission_id:m.id}}const result=await api(path,{method:'POST',headers:{'idempotency-key':`ui:${action}:${m.id}`},body:JSON.stringify(body)});if(action==='verify')message($('operationMessage'),result.report.valid?`Evidence valid: ${result.report.records_checked} records`:`Evidence invalid: ${result.report.errors.map(e=>e.code).join(', ')}`,result.report.valid?'':'error');else await loadDetails(m.id)}catch(error){message($('operationMessage'),error.message,error.status===403?'warn':'error')}finally{setLoading(buttonNode,false,buttonNode.textContent||'Action')}}
function renderJobOutcome(jobResult,outcomeResult){if(jobResult._error&&jobResult._error.status===403){$('jobOutcome').innerHTML='<div class="message warn">This role cannot inspect worker jobs.</div>'}else{const job=jobResult.job;$('jobOutcome').innerHTML=job?`<h3>Job</h3><div class="meta"><span class="chip">${escapeHtml(job.status)}</span><span>Attempts ${escapeHtml(job.attempts)}/${escapeHtml(job.max_attempts)}</span><span>Worker ${escapeHtml(job.lease_owner||'none')}</span></div>${job.last_error?`<div class="message error">${escapeHtml(job.last_error)}</div>`:''}`:'<div class="empty">No execution job has been queued.</div>'}const outcome=outcomeResult.outcome;if(outcome)$('jobOutcome').innerHTML+=`<h3 style="margin-top:14px">Outcome</h3><p>${escapeHtml(outcome.result_summary)}</p><pre>${escapeHtml(JSON.stringify(outcome.metrics||{},null,2))}</pre>`}
function renderEvidence(result,m){if(result._error){$('evidence').innerHTML=`<div class="message ${result._error.status===403?'warn':'error'}">${escapeHtml(result._error.message)}</div>`;return}const rows=result.evidence||[];$('evidence').innerHTML=rows.length?rows.map(row=>`<article class="mission"><strong>#${escapeHtml(row.sequence)} ${escapeHtml(row.title)}</strong><div class="meta"><span>${escapeHtml(row.type)}</span><span>${escapeHtml(row.artifact_sha256?.slice(0,12))}…</span></div></article>`).join(''):'<div class="empty">No evidence has been recorded.</div>'}
function renderTimeline(result){if(result._error){$('timeline').innerHTML=`<div class="message ${result._error.status===403?'warn':'error'}">${escapeHtml(result._error.message)}</div>`;return}const rows=result.events||[];$('timeline').innerHTML=rows.length?`<div class="timeline">${rows.map(row=>`<article><strong>${escapeHtml(row.type)}</strong><br><time>${escapeHtml(new Date(row.timestamp).toLocaleString())}</time></article>`).join('')}</div>`:'<div class="empty">No events recorded.</div>'}
function renderAudit(result){if(result._error){$('audit').innerHTML=`<div class="message ${result._error.status===403?'warn':'error'}">${escapeHtml(result._error.message)}</div>`;return}const rows=result.audits||[];$('audit').innerHTML=rows.length?`<div class="timeline">${rows.map(row=>`<article><strong>${escapeHtml(row.resource_type)} · ${escapeHtml(row.action)}</strong><div>${escapeHtml(row.reason||'')}</div><time>${escapeHtml(row.actor)} · ${escapeHtml(new Date(row.timestamp).toLocaleString())}</time></article>`).join('')}</div>`:'<div class="empty">No audit records.</div>'}
$('loginBtn').onclick=login;$('logoutBtn').onclick=logout;$('refreshBtn').onclick=loadMissions;$('createForm').onsubmit=createMission;document.querySelectorAll('.tabs button').forEach(button=>button.onclick=()=>show(button.dataset.view));renderPrincipal();if(state.token)show('missionsView');checkRuntime();setInterval(checkRuntime,5000);
</script>
</body>
</html>
