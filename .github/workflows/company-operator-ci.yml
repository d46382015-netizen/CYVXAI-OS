name: Autonomous Company Operator

on:
  pull_request:
    paths:
      - "services/operator/**"
      - "scripts/start-company-operator.js"
      - "ui/operator.html"
      - "test/company-operator.test.js"
      - "docs/AUTONOMOUS_COMPANY_OPERATOR.md"
      - "package.json"
      - ".github/workflows/company-operator-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/operator/**"
      - "scripts/start-company-operator.js"
      - "ui/operator.html"
      - "test/company-operator.test.js"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-operator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contract, runtime, evidence, budget, lead, and HTTP verification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_ENV: test
      CYVX_ALLOW_INSECURE_LOCAL: "true"
      CYVX_AUTH_SECRET: "operator-ci-secret-longer-than-thirty-two-characters"
      CYVX_DATA_ROOT: /tmp/cyvx-company-operator-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify operator syntax and lifecycle
        run: npm run operator:verify

      - name: Verify production startup contract
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$CYVX_DATA_ROOT"
          CYVX_OPERATOR_PORT=3020 CYVX_MISSION_PORT=3030 npm run operator > /tmp/company-operator.log 2>&1 &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3020/healthz >/tmp/company-operator-health.json; then
              break
            fi
            sleep 1
          done
          node -e 'const x=require("/tmp/company-operator-health.json");if(!x.ok||!x.health||!x.health.database)process.exit(1)'
          curl -fsS http://127.0.0.1:3020/operator | grep -q "Autonomous Company Operator"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-operator-verification
          path: |
            /tmp/company-operator.log
            /tmp/company-operator-health.json
            /tmp/cyvx-company-operator-ci/logs/*.jsonl*
          if-no-files-found: ignore
          retention-days: 14