name: Materialize Content OS Slice

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.content-os-payload/**'
      - '.github/workflows/materialize-content-os.yml'
  push:
    branches: [feature/content-os-production-slice]
    paths:
      - '.content-os-payload/**'
      - '.github/workflows/materialize-content-os.yml'

permissions:
  contents: write

concurrency:
  group: materialize-content-os
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name == 'push' || github.head_ref == 'feature/content-os-production-slice'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/content-os-production-slice
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify transfer part 00
        run: echo '625054e8c3ef8f5de03dc745aebfab857bbb1c02a433868a4fe0ecb5092924ed  .content-os-payload/part-00' | sha256sum -c -
      - name: Verify transfer part 01
        run: echo 'c1bf662c6dc624f06246b1c90e9b4312d47b8be8f25f2b22abd688cf4be42b18  .content-os-payload/part-01' | sha256sum -c -
      - name: Verify transfer part 02
        run: echo '1a04a4f48df04c28b9399962d5640f2f0dea0f97b106bf119fe9bd83ee5bf99c  .content-os-payload/part-02' | sha256sum -c -
      - name: Verify transfer part 03
        run: echo '17fa7653d2d78072b93c0e2651a846ce8bb389804baceed10ec11f07c814125d  .content-os-payload/part-03' | sha256sum -c -
      - name: Verify transfer part 04a
        run: echo '2c7a1abf753ab5e9ab0e9128bcc2d2c81881058988d6b5cb6437695fa12ff0c2  .content-os-payload/part-04' | sha256sum -c -
      - name: Verify transfer part 04b
        run: echo '9ebebc7193be994ac1aecec8aa7556cf78e977b316f4510746c42a49d716bbf1  .content-os-payload/part-04b' | sha256sum -c -
      - name: Verify transfer part 05
        run: echo '5ebc8ba86e5c43787f876a82bddf5dd92b0350c1fef0acaaa51474fea186e0b0  .content-os-payload/part-05' | sha256sum -c -

      - name: Reconstruct checksum-verified payload
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .content-os-payload/part-* | base64 --decode > /tmp/content-os.tgz
          echo '6980efac704748916dcf34d843e726f9b953f36d844f79e5f56a59a1d9c4b557  /tmp/content-os.tgz' | sha256sum -c -

      - name: Extract production source
        run: tar -xzf /tmp/content-os.tgz

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate source syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check services/content-os/index.js
          node --check services/content-os/server.js
          node --check services/content-os/worker.js
          node --check scripts/verify-content-os.js
          bash -n scripts/content-os.sh

      - name: Run Content OS unit and state tests
        run: npm run content:test

      - name: Run real FFmpeg topic-to-measure proof
        run: npm run content:verify

      - name: Replace transfer payload with verified source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .content-os-payload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build Content OS topic-to-measure production slice [skip ci]'
          git push origin HEAD:feature/content-os-production-slice
