name: CYVX Field Manual

on:
  push:
    branches: [main]
    paths:
      - "apps/field-manual/**"
      - "scripts/field-manual.sh"
      - "scripts/build-field-manual.js"
      - "scripts/start-field-manual.js"
      - "test/field-manual.test.js"
      - "docs/FIELD-MANUAL*.md"
      - ".github/workflows/field-manual.yml"
  pull_request:
    paths:
      - "apps/field-manual/**"
      - "scripts/field-manual.sh"
      - "scripts/build-field-manual.js"
      - "scripts/start-field-manual.js"
      - "test/field-manual.test.js"
      - "docs/FIELD-MANUAL*.md"
      - ".github/workflows/field-manual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: field-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify Field Manual
        run: bash ./scripts/field-manual.sh verify
      - name: Upload publication package
        uses: actions/upload-artifact@v4
        with:
          name: cyvx-field-manual-${{ github.sha }}
          path: dist/field-manual
          if-no-files-found: error
          retention-days: 14
