name: Fix Revenue Ledger Order

on:
  pull_request:
    paths:
      - "scripts/fix-revenue-ledger-order.js"
      - ".github/workflows/fix-revenue-ledger-order.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: node scripts/fix-revenue-ledger-order.js
      - run: node --check services/revenue/engine.js
      - shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- services/revenue/engine.js; then exit 0; fi
          git config user.name "CYVX Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add services/revenue/engine.js
          git commit -m "Make revenue ledger ordering deterministic"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"