name: Verify Supabase integration

on:
  push:
    branches:
      - feat/supabase-public-key

permissions:
  contents: write

jobs:
  verify-and-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/supabase-public-key
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify configured Supabase project live
        run: npm run verify:supabase:live
      - name: Commit deterministic dependency lock if needed
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependency lock already current.'
            exit 0
          fi
          git commit -m 'Install and lock Supabase runtime packages'
          git push origin HEAD:feat/supabase-public-key
