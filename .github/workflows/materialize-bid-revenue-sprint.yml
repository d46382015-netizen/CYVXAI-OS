name: Materialize CYVX Bid Revenue Sprint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: materialize-bid-revenue-sprint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/bid-revenue-sprint-operator
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify and extract production payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/payloads/bid-sprint.part00 \
              .github/payloads/bid-sprint.part01 \
              .github/payloads/bid-sprint.part02 | base64 --decode > /tmp/cyvx-bid-sprint.tgz
          echo 'b617aac61a8c33059916721254c49e5f4288420e9c2f45723b2e9bacedfe7391  /tmp/cyvx-bid-sprint.tgz' | sha256sum --check --strict
          tar -xzf /tmp/cyvx-bid-sprint.tgz -C .
          python - <<'PY'
          from pathlib import Path
          path = Path('services/revenue/bid-sprint.js')
          source = path.read_text()
          source = source.replace('qualified: Number(graph.metrics.qualified || 0),', 'qualified: Number(graph.metrics.qualified_leads || 0),')
          source = source.replace('won: Number(graph.metrics.won || 0),', 'won: Number(graph.metrics.won_deals || 0),')
          source = source.replace('} else if (!graph.deals.some((deal) => ["proposal", "negotiation"].includes(deal.stage))) {', '} else if (metrics.verified_revenue_cents < metrics.target_revenue_cents && !graph.deals.some((deal) => ["proposal", "negotiation"].includes(deal.stage))) {')
          path.write_text(source)
          PY
          chmod +x scripts/bootstrap-bid-revenue-sprint.js scripts/start-company-operator.js

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Bid Revenue Sprint
        id: verify
        shell: bash
        run: |
          set -o pipefail
          npm run bid:sprint:verify 2>&1 | tee /tmp/bid-sprint-test-output.log

      - name: Upload verification diagnostics
        if: failure() && steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: bid-sprint-verification-${{ github.run_id }}
          path: /tmp/bid-sprint-test-output.log
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified production operator
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CYVX Production Builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm -r .github/payloads/bid-sprint.part00 \
                    .github/payloads/bid-sprint.part01 \
                    .github/payloads/bid-sprint.part02 \
                    .github/workflows/materialize-bid-revenue-sprint.yml
          git add package.json \
                  services/revenue/bid-sprint.js \
                  services/operator/universal-server.js \
                  scripts/bootstrap-bid-revenue-sprint.js \
                  scripts/start-company-operator.js \
                  test/bid-revenue-sprint.test.js \
                  ui/bid-revenue-sprint.html \
                  docs/BID_REVENUE_SPRINT.md
          git diff --cached --check
          git commit -m 'Build production CYVX Bid and Revenue Sprint operator'
          git push origin HEAD:feat/bid-revenue-sprint-operator
