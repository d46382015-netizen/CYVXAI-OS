name: Prove Netlify Production Now

on:
  pull_request:
    paths: [.github/workflows/prove-netlify-production-now.yml]
  workflow_dispatch:

permissions: write-all

jobs:
  prove-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Capture production diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/netlify-production
          declare -A urls=(
            [production-root]="https://cyvxai.netlify.app/"
            [production-health]="https://cyvxai.netlify.app/healthz"
            [production-status]="https://cyvxai.netlify.app/api/v1/company-runtime/public/status"
            [production-control]="https://cyvxai.netlify.app/control-room/"
            [main-root]="https://main--cyvxai.netlify.app/"
            [main-health]="https://main--cyvxai.netlify.app/healthz"
            [main-status]="https://main--cyvxai.netlify.app/api/v1/company-runtime/public/status"
            [site-api]="https://api.netlify.com/api/v1/sites/cyvxai.netlify.app"
            [deploys-api]="https://api.netlify.com/api/v1/sites/2277d176-db2c-4022-baaf-e98f65edf594/deploys?per_page=30"
          )
          for name in "${!urls[@]}"; do
            set +e
            curl --proto '=https' --tlsv1.2 --location --silent --show-error \
              --dump-header "/tmp/netlify-production/$name.headers" \
              --output "/tmp/netlify-production/$name.body" \
              --write-out '%{http_code}\n' "${urls[$name]}" > "/tmp/netlify-production/$name.code" 2> "/tmp/netlify-production/$name.error"
            set -e
          done
          for file in /tmp/netlify-production/*; do echo "--- $file"; cat "$file"; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netlify-production-diagnostics-${{ github.run_id }}
          path: /tmp/netlify-production
          if-no-files-found: error
          retention-days: 30
