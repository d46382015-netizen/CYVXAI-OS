name: Prove Netlify Production Now

on:
  pull_request:
    paths: [.github/workflows/prove-netlify-production-now.yml]
  workflow_dispatch:

permissions: write-all

jobs:
  prove-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Capture production diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="https://cyvxai.netlify.app"
          mkdir -p /tmp/netlify-production
          for route in root health status control; do
            case "$route" in
              root) url="$BASE/" ;;
              health) url="$BASE/healthz" ;;
              status) url="$BASE/api/v1/company-runtime/public/status" ;;
              control) url="$BASE/control-room/" ;;
            esac
            set +e
            curl --proto '=https' --tlsv1.2 --location --silent --show-error \
              --dump-header "/tmp/netlify-production/$route.headers" \
              --output "/tmp/netlify-production/$route.body" \
              --write-out '%{http_code}\n' "$url" > "/tmp/netlify-production/$route.code" 2> "/tmp/netlify-production/$route.error"
            set -e
          done
          set +e
          curl --proto '=https' --tlsv1.2 --location --silent --show-error \
            --dump-header /tmp/netlify-production/site-api.headers \
            --output /tmp/netlify-production/site-api.body \
            --write-out '%{http_code}\n' "https://api.netlify.com/api/v1/sites/cyvxai.netlify.app" > /tmp/netlify-production/site-api.code 2> /tmp/netlify-production/site-api.error
          set -e
          for file in /tmp/netlify-production/*; do echo "--- $file"; cat "$file"; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netlify-production-diagnostics-${{ github.run_id }}
          path: /tmp/netlify-production
          if-no-files-found: error
          retention-days: 30
